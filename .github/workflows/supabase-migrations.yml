name: Supabase migration replay

on:
  pull_request:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches:
      - chore/restore-supabase-migrations-20261117
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay migrations on isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migration filenames
        shell: bash
        run: |
          set -euo pipefail
          files=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test -n "$files"
          while IFS= read -r file; do
            name="${file##*/}"
            [[ "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]] || { echo "Invalid migration filename: $name"; exit 1; }
          done <<< "$files"
          duplicates=$(printf '%s\n' "$files" | sed -E 's#^.*/([0-9]{14})_.*#\1#' | sort | uniq -d)
          test -z "$duplicates" || { echo "Duplicate migration timestamps: $duplicates"; exit 1; }
          count=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
          echo "Found $count SQL migrations with valid unique timestamps."

      - name: Start isolated local Supabase stack
        run: supabase start --exclude inbucket

      - name: Replay all migrations from an empty local database
        run: supabase db reset --local

      - name: Verify local migration history
        run: |
          set -euo pipefail
          supabase migration list --local
