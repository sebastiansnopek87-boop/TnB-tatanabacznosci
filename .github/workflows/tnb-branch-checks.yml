name: TnB branch checks

on:
  push:
    branches:
      - migration/react-router-spa
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: ESLint
        run: bun run lint
