name: TnB branch checks

on:
  push:
    branches:
      - migration/react-router-spa
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, API lint and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Scan production bundle for server-only credentials
        run: bash scripts/scan-dist-secrets.sh dist

      - name: Lint migrated browser API adapters
        run: >-
          bunx eslint
          src/lib/api/edge.ts
          src/lib/api/useServerFn.ts
          src/lib/api/users.ts
          src/lib/api/brand.ts
          src/lib/api/platform.ts
          src/lib/api/templates.ts
          --rule 'prettier/prettier: off'
