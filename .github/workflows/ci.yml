name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Assert static React SPA build
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/.htaccess
          grep -Eq 'src="/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/assets/[^"]+\.css"' dist/index.html
          grep -Fq 'RewriteRule . /index.html [L]' dist/.htaccess
          test ! -e .output
          if grep -R -n -E --include='*.ts' --include='*.tsx' --exclude='*.test.ts' '@tanstack/react-start|useServerFn|createServerFn' src; then
            echo "::error::TanStack Start server code found in the React SPA source."
            exit 1
          fi
          if find src -type f \( -name '*.functions.ts' -o -name '*.server.ts' \) -print -quit | grep -q .; then
            echo "::error::Legacy Server Function modules remain in src/."
            exit 1
          fi

      - name: Scan static build for server-only code and secrets
        run: bash scripts/scan-dist-secrets.sh dist

      - name: Lint changed source files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/lint-changed.sh
