name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: https://pmdfiipontreuclfumdh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_D5uXWeutbm81D3KRn4NPNA_fH-WZVGG
        run: bun run build

      - name: Verify committed TanStack route tree is up to date
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error::TanStack regenerated src/routeTree.gen.ts during build. Commit the generated route tree with the route source changes."
            git diff --stat -- src/routeTree.gen.ts
            exit 1
          fi

      - name: Static SPA route fallback smoke test
        shell: bash
        run: |
          test -f dist/.htaccess
          grep -Fq 'RewriteRule . /index.html [L]' dist/.htaccess
          bun run preview -- --host 127.0.0.1 > /tmp/tnb-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [[ "$READY" != "1" ]]; then
            cat /tmp/tnb-preview.log
            echo "::error::Vite preview did not start."
            exit 1
          fi
          for route in / /auth /reset-password /artykuly /artykuly/przykladowy /biblioteka /biblioteka/przykladowy /podcast /podcast/przykladowy /spotkania /spotkania/przykladowe /spolecznosc /admin /admin/spotkania /newsletter/wypisz /newsletter/potwierdz; do
            CODE=$(curl -sS -o /tmp/tnb-route.html -w '%{http_code}' "http://127.0.0.1:4173$route")
            if [[ "$CODE" != "200" ]] || ! grep -q 'id="root"' /tmp/tnb-route.html; then
              echo "::error::SPA route fallback failed for $route (HTTP $CODE)."
              exit 1
            fi
          done

      - name: Set up Deno for Edge Function unit tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Shared Edge Function unit tests
        run: deno test supabase/functions/_shared/checkout-idempotency.test.ts supabase/functions/_shared/delivery-outbox.test.ts supabase/functions/_shared/cron-auth.test.ts supabase/functions/_shared/payment-webhook.test.ts

      - name: TypeScript validation
        run: bun run typecheck

      - name: Verify SPA source boundary
        run: bash scripts/check-spa-boundary.sh

      - name: Verify legacy runtime isolation
        run: bash scripts/check-legacy-runtime-isolation.sh

      - name: Verify Supabase Edge Function source/config coverage
        run: bash scripts/check-edge-function-sync.sh

      - name: Unit tests
        run: bun run test


      - name: Scan static build for server-only code and secrets
        shell: bash
        run: |
          if [[ -d "dist" ]]; then
            OUTPUT_DIR="dist"
          elif [[ -d ".output/public" ]]; then
            OUTPUT_DIR=".output/public"
          else
            echo "::error::No known client build output directory found."
            exit 1
          fi
          bash scripts/scan-dist-secrets.sh "$OUTPUT_DIR"

      - name: Lint changed source files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/lint-changed.sh

      - name: Upload production-ready static SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnb-react-spa-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
