name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Scan static build for server-only code and secrets
        shell: bash
        run: |
          if [[ -d "dist" ]]; then
            OUTPUT_DIR="dist"
          elif [[ -d ".output/public" ]]; then
            OUTPUT_DIR=".output/public"
          else
            echo "::error::No known client build output directory found."
            exit 1
          fi
          bash scripts/scan-dist-secrets.sh "$OUTPUT_DIR"

      - name: Lint application
        run: bun run lint
